spring.application.name=myProj

# Render sets PORT; local default 8080
server.port=${PORT:8080}

# Override on Render with env (Neon JDBC URL, user, password)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myproj}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Must be at least 32 characters for HMAC-SHA256
jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-chars}
jwt.expiration=${JWT_EXPIRATION:3600000}
refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

# Local only: spring.profiles.active=local in application-local.properties or env
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR

# Comma-separated browser origins (Vercel URL + local dev)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
